{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Document Automation{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'frontend/vendor/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'frontend/css/styles.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'clients-list-page' %}">Document Automation</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#main-navbar" aria-controls="main-navbar"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="main-navbar">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link{% if request.resolver_match.url_name == 'clients-list-page' %} active{% endif %}"
                           href="{% url 'clients-list-page' %}">Clients</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer mt-auto py-3 bg-light border-top">
        <div class="container text-muted small">
            © 2026 Document Automation — internal tool
        </div>
    </footer>

    <script src="{% static 'frontend/vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
