{% extends "frontend/base.html" %}
{% load static %}

{% block title %}Clients — Document Automation{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="mb-0">Clients</h1>
    <a class="btn btn-primary" href="{% url 'client-add-page' %}">+ Add Client</a>
</div>

<div id="clients-error" class="alert alert-danger d-none" role="alert"></div>

<table class="table table-striped table-hover align-middle">
    <thead>
        <tr>
            <th>Client Name</th>
            <th>Short Name</th>
            <th>SPOC Name</th>
            <th class="table-column-actions">Actions</th>
        </tr>
    </thead>
    <tbody id="clients-tbody">
        <tr>
            <td colspan="4" class="text-muted">Loading clients…</td>
        </tr>
    </tbody>
</table>
{% endblock %}

{% block scripts %}
<script src="{% static 'frontend/js/clients.js' %}" defer></script>
{% endblock %}
